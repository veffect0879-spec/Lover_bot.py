<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Assistant</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    background: #f4f5f7;
  }
  #chat-container {
    display: flex; flex-direction: column; height: 100vh;
  }
  #header {
    background: #2563eb; color: #fff; padding: 14px 16px;
    font-size: 18px; font-weight: 600; flex-shrink: 0;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .bubble {
    max-width: 80%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.4; font-size: 15px; white-space: pre-wrap; word-break: break-word;
  }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #fff; color: #111; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .typing { align-self: flex-start; color: #9ca3af; font-size: 13px; padding: 0 6px; }
  #input-bar {
    display: flex; gap: 8px; padding: 10px; background: #fff;
    border-top: 1px solid #e5e7eb; flex-shrink: 0;
  }
  #msg-input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 20px;
    padding: 10px 16px; font-size: 15px; outline: none;
  }
  #send-btn {
    background: #2563eb; color: #fff; border: none; border-radius: 20px;
    padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #send-btn:disabled { background: #93c5fd; }
</style>
</head>
<body>
<div id="chat-container">
  <div id="header">💬 Chat Assistant</div>
  <div id="messages"></div>
  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="မေးခွန်းရိုက်ထည့်ပါ..." autocomplete="off">
    <button id="send-btn">ပို့မယ်</button>
  </div>
</div>

<script>
  // IMPORTANT: replace with your deployed Render backend URL
  const API_BASE = "";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");

  // A stable per-install device id, stored in-memory + passed to Android
  // via localStorage fallback. (No server-side auth needed for a simple
  // single-user chatbot; each device just has its own history.)
  function getDeviceId() {
    let id = localStorage.getItem("device_id");
    if (!id) {
      id = "dev-" + Math.random().toString(36).slice(2) + Date.now();
      localStorage.setItem("device_id", id);
    }
    return id;
  }
  const deviceId = getDeviceId();

  function addBubble(text, sender) {
    const div = document.createElement("div");
    div.className = "bubble " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    sendBtn.disabled = true;

    addBubble(text, "user");
    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = "စာရိုက်နေသည်...";
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch(API_BASE + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: deviceId, message: text })
      });
      const data = await res.json();
      typingEl.remove();
      addBubble(data.reply || "အမှားတစ်ခုခု ဖြစ်သွားပါတယ်", "bot");
    } catch (e) {
      typingEl.remove();
      addBubble("Network error — ချိတ်ဆက်မှု စစ်ကြည့်ပါ", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  addBubble("မင်္ဂလာပါ! ဘာကူညီပေးရမလဲ? 😊", "bot");
</script>
</body>
</html>
