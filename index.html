<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI - Telegram Mini App</title>
    <!-- Telegram Web App JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            color: white;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        /* Chat Container */
        .chat-container {
            flex: 1;
            background-color: #f8f9fa;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.05);
        }
        /* Message Bubbles */
        .message {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 75%;
        }
        .message.incoming {
            align-self: flex-start;
        }
        .message.outgoing {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .bubble {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }
        .incoming .bubble {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border-bottom-left-radius: 5px;
        }
        .outgoing .bubble {
            background: white;
            color: #333;
            border-bottom-right-radius: 5px;
        }
        .time {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        /* Input Area */
        .input-area {
            background-color: #f8f9fa;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-box {
            flex: 1;
            background: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            outline: none;
        }
        .send-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.4);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span>←</span>
            <span>Lanet</span>
        </div>
        <div>🔍 ⋮</div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
        
        <!-- Incoming Message -->
        <div class="message incoming">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="avatar" alt="Avatar">
            <div>
                <div class="bubble">Hello. 😍😍😍</div>
                <div class="time" style="color: rgba(255,255,255,0.7);">7:10 pm</div>
            </div>
        </div>

        <!-- Outgoing Message -->
        <div class="message outgoing">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="avatar" alt="Avatar">
            <div>
                <div class="bubble">Wow ! Really Nice. 😁</div>
                <div class="time">7:20 pm</div>
            </div>
        </div>

    </div>

    <!-- Input Bar -->
    <div class="input-area">
        <input type="text" class="input-box" placeholder="Your message...">
        <button class="send-btn">👋</button>
    </div>

    <script>
        // Telegram Web App initialization
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
